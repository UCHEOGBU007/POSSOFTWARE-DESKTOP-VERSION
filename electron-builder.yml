appId: com.Tsolusions.Stockura
productName: Stockura Pos & Inventory
copyright: Copyright © 2025 PT Tech Solusions Group

artifactName: Stockura -setup-${version}.${ext}
directories:
  output: release/build

files:
  - dist/**/*
  - desktop/dist/**/*
  - public/**/*
  - node_modules/**/*
  - package.json

# Windows-specific configuration
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: public/favicon.ico

# NSIS installer configuration (Windows)
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Stockura POS & inventory
  installerIcon: public/favicon.ico
  uninstallerIcon: public/favicon.ico
  installerHeaderIcon: public/favicon.ico
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  menuCategory: Stockura POS & inventory
  displayLanguageSelector: false
  installerLanguages:
    - en_US
  license: false
  warningsAsErrors: false

# macOS-specific configuration
mac:
  target: dmg
  icon: public/icon.png
  category: public.app-category.business

# Linux-specific configuration
linux:
  target:
    - AppImage
  icon: public/icon.png

forceCodeSigning: false
